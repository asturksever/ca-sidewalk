name: Build PMTiles

# Reproduces the ENTIRE data pipeline on the runner — both inputs are public
# URLs (StatCan CPND zip, Geofabrik Canada PBF) — then tiles with tippecanoe
# and attaches canada_sidewalks.pmtiles to the tiles release. Nothing needs to
# be uploaded from the dev machine (which can neither run tippecanoe under its
# binary-authorization lockdown nor sustain large git pushes).
#
# Alternative trigger: pushing pre-conflated chunks on the `data` branch via
# scripts/41_push_data_branch.sh skips straight to tiling (see `push:` below).
on:
  push:
    branches: [data]
  workflow_dispatch:
    inputs:
      tiles_tag:
        description: Release tag to attach canada_sidewalks.pmtiles to
        default: tiles-v1
        required: true

permissions:
  contents: write

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install tippecanoe
        run: |
          git clone --depth 1 https://github.com/felt/tippecanoe /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install
          tippecanoe --version

      - name: Install Python deps
        run: pip install --quiet duckdb pyogrio shapely pyarrow geopandas numpy quackosm

      - name: Obtain unified.parquet
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin data >/dev/null 2>&1 && [ "${GITHUB_REF_NAME}" = "data" ]; then
            echo "Using pre-conflated chunks from data branch"
            cat data-chunks/unified.parquet.part-* > data/build/unified.parquet
          else
            echo "Running full pipeline from public sources"
            mkdir -p data/raw data/build
            # CPND (StatCan catalogue 34-26-0004)
            curl -sL -o data/raw/cpnd.zip \
              https://www150.statcan.gc.ca/n1/en/pub/34-26-0004/2025001/zip/canadian_pedestrian_network.zip
            unzip -q data/raw/cpnd.zip -d data/raw/ && rm data/raw/cpnd.zip
            python scripts/00_extract_cpnd.py
            rm -rf data/raw/EN
            # OSM Canada
            curl -sL -o data/raw/canada-latest.osm.pbf \
              https://download.geofabrik.de/north-america/canada-latest.osm.pbf
            python scripts/11_filter_osm.py
            rm -f data/raw/canada-latest.osm.pbf && rm -rf files
            df -h /
            python scripts/30_conflate.py
          fi
          ls -lh data/build/unified.parquet

      - name: Convert to FlatGeobuf
        run: |
          python - <<'EOF'
          import geopandas as gpd
          gdf = gpd.read_parquet('data/build/unified.parquet')
          gdf.to_file('unified.fgb', driver='FlatGeobuf')
          print(len(gdf), 'features')
          EOF
          rm -f data/build/unified.parquet

      - name: Tippecanoe
        run: |
          tippecanoe -o canada_sidewalks.pmtiles -l sidewalks -Z4 -z14 \
            --drop-densest-as-needed --extend-zooms-if-still-dropping \
            --coalesce --reorder --hilbert \
            -y provenance -y cls -y street -y muni -y prov -y material -y width \
            --force unified.fgb
          ls -lh canada_sidewalks.pmtiles

      - name: Attach tiles to release
        env:
          GH_TOKEN: ${{ github.token }}
          TILES_TAG: ${{ inputs.tiles_tag || 'tiles-v1' }}
        run: |
          gh release view "$TILES_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TILES_TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "PMTiles $TILES_TAG" \
                 --notes "National unified pedestrian network tiles (CPND x OSM)"
          gh release upload "$TILES_TAG" canada_sidewalks.pmtiles --clobber \
            --repo "$GITHUB_REPOSITORY"
